org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+UseG1GC -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m
kotlin.code.style=official
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.tooling.parallel=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.parallel=true
# AGP 9+ defaults to unit tests only for the tested build type; Compose Preview needs them on every variant.
android.onlyEnableUnitTestForTheTestedBuildType=false
